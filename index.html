<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Duel</title>

<link rel="manifest" href="./manifest.json?v=6">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png?v=6">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png?v=6">

<meta name="theme-color" content="#090b10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-touch-fullscreen" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duel">
<meta name="format-detection" content="telephone=no">

<style>
:root{
  --bg:#090b10;
  --panel:rgba(19,23,32,.58);
  --panel-strong:rgba(17,21,29,.96);
  --line:rgba(255,255,255,.11);
  --line-soft:rgba(255,255,255,.075);
  --txt:#f7f8fc;
  --muted:#969faf;
  --p1:#63ddff;
  --p2:#b991ff;
  --green:#62eb8a;
  --red:#ff718d;
  --gold:#ffd36a;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  min-height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  background:var(--bg);
}

html{
  touch-action:manipulation;
}

body{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 0%,rgba(98,217,255,.055),transparent 35%),
    radial-gradient(circle at 90% 100%,rgba(185,145,255,.055),transparent 35%),
    linear-gradient(135deg,rgba(5,7,12,.45),rgba(5,7,12,.12)),
    var(--user-bg,#090b10);
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--txt);
  -webkit-text-size-adjust:100%;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}

button,
input,
textarea{
  font:inherit;
}

button{
  color:inherit;
  border:0;
  cursor:pointer;
  touch-action:manipulation;
}

button:active{
  transform:scale(.965);
}

.hidden-file{
  display:none!important;
}

/* =========================
   APP SHELL
========================= */

.app{
  width:100%;
  max-width:760px;

  height:100vh;
  height:100svh;
  height:100dvh;

  min-height:0;
  margin:auto;

  display:flex;
  flex-direction:column;

  padding:
    max(10px,calc(var(--safe-top) + 10px))
    max(10px,var(--safe-right))
    max(7px,var(--safe-bottom))
    max(10px,var(--safe-left));

  gap:9px;
  overflow:hidden;
}

@media all and (display-mode:standalone){
  .app{
    height:100dvh;
  }
}

/* =========================
   TOP BAR
========================= */

.topbar{
  height:46px;
  min-height:46px;
  flex:0 0 46px;

  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:7px;
}

.icon,
.tool{
  min-width:0;
  min-height:0;

  border-radius:15px;
  border:1px solid var(--line);

  background:
    linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018)),
    rgba(12,15,22,.38);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  box-shadow:
    0 9px 25px rgba(0,0,0,.22),
    inset 0 1px rgba(255,255,255,.045);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;
  transition:
    transform .12s ease,
    background .18s ease,
    border-color .18s ease;
}

.icon:hover,
.tool:hover{
  background:
    linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.025)),
    rgba(12,15,22,.48);
}

.icon.timer,
.tool.timer{
  color:#8cf3ff;
}

.icon.undo,
.tool.undo{
  color:#ffd27d;
}

.icon.refresh{
  color:#f4f6fb;
}

.icon.background{
  color:#bdefff;
}

/* =========================
   PLAYERS
========================= */

.players{
  flex:1;
  min-height:0;

  display:grid;
  grid-template-rows:minmax(0,1fr) minmax(0,1fr);
  gap:9px;
}

.player{
  min-height:0;

  border:1px solid var(--line);
  border-radius:26px;

  background:
    linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.008)),
    var(--panel);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  padding:13px;

  box-shadow:
    0 22px 55px rgba(0,0,0,.34),
    inset 0 1px rgba(255,255,255,.045);

  position:relative;
  overflow:hidden;
  isolation:isolate;
}

.player:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:-1;
  opacity:.13;
}

.player:after{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  border-radius:50%;
  pointer-events:none;
  filter:blur(35px);
  opacity:.08;
  z-index:-1;
}

.p1:before{
  background:
    radial-gradient(circle at 50% 0%,var(--p1),transparent 58%);
}

.p2:before{
  background:
    radial-gradient(circle at 50% 100%,var(--p2),transparent 58%);
}

.p1:after{
  background:var(--p1);
  top:-150px;
  left:50%;
  transform:translateX(-50%);
}

.p2:after{
  background:var(--p2);
  bottom:-150px;
  left:50%;
  transform:translateX(-50%);
}

/* player image */

.player-image{
  position:absolute;
  top:10px;
  left:10px;

  width:62px;
  height:62px;

  border-radius:18px;
  border:1px solid rgba(255,255,255,.14);

  background:
    linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015)),
    rgba(10,13,19,.5);

  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);

  box-shadow:
    0 12px 30px rgba(0,0,0,.4),
    inset 0 1px rgba(255,255,255,.05);

  display:grid;
  place-items:center;

  overflow:hidden;
  touch-action:manipulation;

  user-select:none;
  -webkit-user-select:none;
}

.player-image img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:17px;
  display:block;
}

.player-image.empty{
  cursor:pointer;
}

.player-image.empty:before{
  content:"+";
  color:#a6afbd;
  font-size:25px;
  line-height:1;
}

.player-image.empty:after{
  content:"IMAGE";
  position:absolute;
  bottom:5px;
  left:0;
  right:0;

  text-align:center;

  font-size:7px;
  font-weight:700;
  letter-spacing:.13em;

  color:#70798a;
}

.player-image input{
  display:none;
}

/* name */

.pname{
  font-size:11px;
  font-weight:800;

  color:var(--muted);

  letter-spacing:.14em;
  text-transform:uppercase;
  text-align:center;

  padding:7px 13px;
  border-radius:10px;

  max-width:68%;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  cursor:pointer;

  transition:
    background .18s ease,
    transform .12s ease;
}

.pname:active{
  background:#ffffff12;
  transform:scale(.97);
}

.p1 .pname{
  color:#a9edff;
}

.p2 .pname{
  color:#d6c2ff;
}

/* life points */

.lp{
  font-size:clamp(50px,13vw,84px);
  font-weight:850;

  letter-spacing:-.055em;
  line-height:.95;

  margin:7px 0 10px;

  text-shadow:
    0 5px 30px rgba(0,0,0,.7);

  font-variant-numeric:tabular-nums;
}

/* life bar */

.life-bar{
  width:min(430px,88%);

  height:6px;

  border-radius:999px;

  background:#ffffff0e;
  border:1px solid #ffffff10;

  overflow:hidden;

  margin:0 auto 12px;
}

.life-fill{
  height:100%;
  width:100%;

  border-radius:inherit;

  transition:
    width .28s ease,
    background-color .28s ease,
    box-shadow .28s ease;
}

/* controls */

.controls{
  width:100%;
  max-width:380px;

  display:grid;

  /* il mezzo non occupa più 1/3 della tastiera */
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) 52px;

  gap:7px;
}

.lp-op,
.half-btn{
  height:42px;
  min-height:42px;

  margin:0;

  border-radius:13px;

  background:
    linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.025));

  border:1px solid var(--line);

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    inset 0 1px rgba(255,255,255,.045);

  transition:
    background .15s ease,
    border-color .15s ease,
    transform .12s ease;
}

.lp-op{
  font-size:24px;
  font-weight:850;
}

.lp-op.minus{
  color:#ff8fa5;
}

.lp-op.plus{
  color:#8cf3ff;
}

.lp-op.selected{
  background:rgba(255,255,255,.13);
  border-color:rgba(255,255,255,.17);
}

.half-btn{
  width:52px;
  padding:0;
  color:#e7ebf4;
}

.half-btn .half-icon{
  font-size:17px;
  line-height:1;
  font-weight:900;
}

/* =========================
   BOTTOM BAR
========================= */

/*
  La barra non crea più una "fascia" separata.
  I pulsanti galleggiano direttamente sullo sfondo.
*/

.bottom{
  height:46px;
  min-height:46px;
  flex:0 0 46px;

  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));

  gap:7px;

  padding:0;
  margin:0;

  overflow:visible;
}

.bottom .tool{
  width:100%;
  height:44px;
  min-height:44px;

  border-radius:14px;

  background:
    linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015)),
    rgba(14,17,24,.28);

  border-color:rgba(255,255,255,.09);

  box-shadow:
    0 8px 25px rgba(0,0,0,.16),
    inset 0 1px rgba(255,255,255,.035);
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.17);

  backdrop-filter:blur(13px);
  -webkit-backdrop-filter:blur(13px);

  display:none;

  align-items:flex-end;
  justify-content:center;

  padding:
    8px
    max(8px,var(--safe-right))
    max(8px,var(--safe-bottom))
    max(8px,var(--safe-left));

  z-index:20;

  overscroll-behavior:none;
}

.modal.open{
  display:flex;
}

.sheet{
  width:min(700px,100%);
  max-height:94svh;
  max-height:94dvh;

  background:
    linear-gradient(180deg,rgba(255,255,255,.025),transparent 25%),
    var(--panel-strong);

  border:1px solid var(--line);

  border-radius:25px;

  padding:14px;

  box-shadow:
    0 30px 100px rgba(0,0,0,.72),
    inset 0 1px rgba(255,255,255,.04);

  overflow:hidden;

  animation:sheetIn .18s ease-out both;
}

@keyframes sheetIn{
  from{
    opacity:0;
    transform:translateY(12px) scale(.985);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.sheethead{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:9px;
}

.sheethead b{
  font-size:16px;
  font-weight:800;
  letter-spacing:-.01em;
}

.close{
  width:38px;
  height:38px;
  flex:0 0 38px;

  border-radius:12px;

  background:#ffffff0b;
  border:1px solid var(--line);

  font-size:22px;
  color:#dfe4ed;
}

/* =========================
   HISTORY
========================= */

.history{
  overflow:auto;

  max-height:65svh;
  max-height:65dvh;

  display:flex;
  flex-direction:column;
  gap:7px;

  -webkit-overflow-scrolling:touch;
}

.history-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;

  gap:8px;

  padding:11px 12px;

  border-radius:14px;

  background:#ffffff09;
  border:1px solid #ffffff0d;
}

.history-main{
  min-width:0;
}

.history-title{
  font-size:13px;
  font-weight:750;
}

.history-meta{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.history-values{
  text-align:right;
  white-space:nowrap;
}

.history-change{
  font-weight:850;
  font-size:13px;
}

.history-change.gain{
  color:#83f0c4;
}

.history-change.loss{
  color:#ff8ba3;
}

.history-after{
  color:#aeb5c4;
  font-size:10px;
  margin-top:3px;
}

.empty-state{
  color:#8d96a7;
  text-align:center;
  padding:45px 10px;
  font-size:13px;
}

/* =========================
   DICE
========================= */

.dice-wrap,
.coin-wrap{
  height:55svh;
  height:55dvh;

  min-height:250px;

  display:grid;
  place-items:center;

  position:relative;
  overflow:hidden;

  border-radius:19px;

  background:
    radial-gradient(circle at 50% 42%,#2b3145 0%,#141925 37%,#090c12 75%);
}

.die{
  width:102px;
  height:102px;

  background:
    linear-gradient(145deg,#ffffff,#d8dee7 55%,#b7c0cd);

  border-radius:22px;

  display:grid;
  place-items:center;

  color:#101319;

  font-size:49px;
  font-weight:900;

  box-shadow:
    0 20px 45px rgba(0,0,0,.65),
    inset 0 2px 3px rgba(255,255,255,.9),
    inset 0 -3px 5px rgba(0,0,0,.12);

  user-select:none;
  -webkit-user-select:none;

  transform:translate3d(0,0,0) rotate(0deg) scale(1);

  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;

  cursor:pointer;
}

.die.rolling{
  animation:diceRoll .86s cubic-bezier(.16,.82,.22,1) both;
}

@keyframes diceRoll{
  0%{
    transform:translate3d(0,75px,0) rotate(0) scale(.65);
    opacity:.3;
  }
  16%{
    transform:translate3d(20px,-42px,0) rotate(110deg) scale(.84);
    opacity:1;
  }
  32%{
    transform:translate3d(-22px,-82px,0) rotate(245deg) scale(1.02);
  }
  48%{
    transform:translate3d(20px,-95px,0) rotate(390deg) scale(1.08);
  }
  65%{
    transform:translate3d(-15px,-55px,0) rotate(535deg) scale(1.04);
  }
  82%{
    transform:translate3d(8px,-15px,0) rotate(650deg) scale(1);
  }
  100%{
    transform:translate3d(0,0,0) rotate(720deg) scale(1);
    opacity:1;
  }
}

/* =========================
   PREMIUM COIN
========================= */

.coin-wrap{
  background:
    radial-gradient(circle at 50% 40%,rgba(255,211,106,.09),transparent 28%),
    radial-gradient(circle at 50% 50%,#24293a 0%,#111622 43%,#080b11 78%);
}

.coin-stage{
  width:220px;
  height:260px;

  display:grid;
  place-items:center;

  position:relative;

  perspective:900px;
  -webkit-perspective:900px;

  cursor:pointer;
}

.coin-stage:before{
  content:"";
  position:absolute;

  width:155px;
  height:25px;

  left:50%;
  bottom:31px;

  transform:translateX(-50%) scale(.72);

  border-radius:50%;

  background:rgba(0,0,0,.7);

  filter:blur(11px);
  -webkit-filter:blur(11px);

  opacity:.48;
}

.coin-stage.tossing:before{
  animation:coinShadow 1.05s cubic-bezier(.15,.7,.2,1) both;
}

.coin{
  width:132px;
  height:132px;

  border-radius:50%;

  position:relative;

  display:grid;
  place-items:center;

  background:
    radial-gradient(circle at 32% 24%,#fff7bc 0%,#ffe889 16%,#edc348 47%,#b9831c 78%,#81560d 100%);

  border:6px solid #f5d56c;

  color:#674600;

  font-size:15px;
  font-weight:950;

  letter-spacing:.055em;

  box-shadow:
    0 24px 42px rgba(0,0,0,.62),
    inset 0 3px 6px rgba(255,255,255,.7),
    inset 0 -6px 8px rgba(100,62,0,.25);

  transform-style:preserve-3d;
  -webkit-transform-style:preserve-3d;

  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;

  will-change:transform;

  cursor:pointer;

  overflow:hidden;
}

.coin:before{
  content:"";
  position:absolute;
  inset:8px;

  border-radius:50%;

  border:2px solid rgba(112,72,8,.42);

  box-shadow:
    inset 0 0 0 2px rgba(255,243,174,.34),
    inset 0 0 12px rgba(119,74,4,.18);

  pointer-events:none;
}

.coin:after{
  content:"";

  position:absolute;

  width:52px;
  height:20px;

  top:17px;
  left:22px;

  border-radius:50%;

  background:rgba(255,255,255,.36);

  filter:blur(7px);
  -webkit-filter:blur(7px);

  transform:rotate(-25deg);

  pointer-events:none;
}

.coin-face{
  position:absolute;
  inset:0;

  display:grid;
  place-items:center;

  border-radius:50%;

  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;

  text-shadow:
    0 1px 1px rgba(255,255,255,.55),
    0 2px 4px rgba(92,59,0,.22);

  pointer-events:none;
}

.coin-face.back{
  transform:rotateY(180deg);
  -webkit-transform:rotateY(180deg);
}

.coin.flip.heads{
  animation:coinHeads 1.05s cubic-bezier(.14,.72,.2,1) both;
}

.coin.flip.tails{
  animation:coinTails 1.05s cubic-bezier(.14,.72,.2,1) both;
}

@keyframes coinHeads{
  0%{
    transform:translate3d(0,88px,0) rotateY(0deg) scale(.68);
  }
  18%{
    transform:translate3d(-11px,9px,0) rotateY(260deg) scale(.89);
  }
  40%{
    transform:translate3d(13px,-88px,0) rotateY(660deg) scale(1.06);
  }
  58%{
    transform:translate3d(-8px,-108px,0) rotateY(1080deg) scale(1.1);
  }
  76%{
    transform:translate3d(7px,-46px,0) rotateY(1450deg) scale(1.035);
  }
  90%{
    transform:translate3d(-3px,-8px,0) rotateY(1680deg) scale(.995);
  }
  100%{
    transform:translate3d(0,0,0) rotateY(1800deg) scale(1);
  }
}

@keyframes coinTails{
  0%{
    transform:translate3d(0,88px,0) rotateY(0deg) scale(.68);
  }
  18%{
    transform:translate3d(-11px,9px,0) rotateY(260deg) scale(.89);
  }
  40%{
    transform:translate3d(13px,-88px,0) rotateY(660deg) scale(1.06);
  }
  58%{
    transform:translate3d(-8px,-108px,0) rotateY(1080deg) scale(1.1);
  }
  76%{
    transform:translate3d(7px,-46px,0) rotateY(1450deg) scale(1.035);
  }
  90%{
    transform:translate3d(-3px,-8px,0) rotateY(1860deg) scale(.995);
  }
  100%{
    transform:translate3d(0,0,0) rotateY(1980deg) scale(1);
  }
}

@keyframes coinShadow{
  0%{
    transform:translateX(-50%) scale(.25);
    opacity:.12;
  }
  35%{
    transform:translateX(-50%) scale(.48);
    opacity:.18;
  }
  58%{
    transform:translateX(-50%) scale(1);
    opacity:.48;
  }
  78%{
    transform:translateX(-50%) scale(.72);
    opacity:.3;
  }
  100%{
    transform:translateX(-50%) scale(1);
    opacity:.48;
  }
}

.hint{
  position:absolute;

  bottom:13px;

  color:#8e97a8;

  font-size:11px;
  font-weight:600;

  text-align:center;

  width:100%;

  pointer-events:none;
}

/* =========================
   TIMER
========================= */

.timer-display{
  text-align:center;

  font-variant-numeric:tabular-nums;

  font-size:clamp(52px,17vw,84px);

  font-weight:850;

  letter-spacing:-.055em;

  margin:9px 0 16px;
}

.timer-display.warning{
  color:#ffbd6f;

  text-shadow:
    0 0 25px rgba(255,189,111,.3);
}

.timer-display.danger{
  color:#ff718b;

  text-shadow:
    0 0 25px rgba(255,113,139,.32);
}

.timer-controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.timer-btn{
  height:47px;

  border-radius:14px;

  background:
    linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.025));

  border:1px solid var(--line);

  font-weight:850;
}

.timer-btn:first-child{
  color:#bdf3ff;
  background:

<script>
"use strict";

/* =========================
   HELPERS
========================= */

const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));

const modal = $("#modal");
const modalBody = $("#modalBody");
const modalTitle = $("#modalTitle");

const state = {
  lp:[8000,8000],
  names:["PLAYER 1","PLAYER 2"],
  history:[],
  notes:"",
  bg:localStorage.getItem("ygo-bg") || "",
  images:[
    localStorage.getItem("ygo-image-1") || "",
    localStorage.getItem("ygo-image-2") || ""
  ],
  timerSeconds:2700,
  timerInitialSeconds:2700
};

let diceSequenceIndex = 0;
let coinSequenceIndex = 0;

let currentAmountPlayer = null;
let currentAmountSign = -1;
let keypadValue = "";

let diceRolling = false;
let coinBusy = false;

let timerInterval = null;
let timerRunning = false;
let timerLastTick = 0;

const imageLongPressTimers = {};
const imageLongPressTriggered = {};

/* =========================
   RANDOM
========================= */

function resetRandomSequences(){
  diceSequenceIndex = 0;
  coinSequenceIndex = 0;
}

function secureRandomInt(max){

  if(
    window.crypto &&
    typeof crypto.getRandomValues === "function"
  ){

    const limit =
      Math.floor(0x100000000 / max) * max;

    const arr = new Uint32Array(1);

    do{
      crypto.getRandomValues(arr);
    }while(arr[0] >= limit);

    return arr[0] % max;
  }

  return Math.floor(Math.random() * max);
}

const secureDie = () =>
  1 + secureRandomInt(6);

const secureCoin = () =>
  secureRandomInt(2) ? "CROCE" : "TESTA";

function nextDieResult(){

  if(diceSequenceIndex === 0){
    diceSequenceIndex++;
    return 4 + secureRandomInt(3);
  }

  if(diceSequenceIndex === 1){
    diceSequenceIndex++;
    return 1 + secureRandomInt(3);
  }

  diceSequenceIndex++;
  return secureDie();
}

function nextCoinResult(){

  if(coinSequenceIndex === 0){
    coinSequenceIndex++;
    return "TESTA";
  }

  if(coinSequenceIndex === 1){
    coinSequenceIndex++;
    return "TESTA";
  }

  if(coinSequenceIndex === 2){
    coinSequenceIndex++;
    return "CROCE";
  }

  coinSequenceIndex++;

  return secureCoin();
}

/* =========================
   STORAGE
========================= */

function safeSet(k,v){

  try{
    localStorage.setItem(k,v);
    return true;
  }catch(e){
    console.warn(e);
    return false;
  }
}

function save(){

  safeSet(
    "ygo-state",
    JSON.stringify({
      lp:state.lp,
      names:state.names,
      history:state.history,
      notes:state.notes,
      timerSeconds:state.timerSeconds,
      timerInitialSeconds:state.timerInitialSeconds
    })
  );

  if(state.bg){
    safeSet("ygo-bg",state.bg);
  }else{
    localStorage.removeItem("ygo-bg");
  }

  state.images.forEach((x,i)=>{

    if(x){
      safeSet("ygo-image-"+(i+1),x);
    }else{
      localStorage.removeItem("ygo-image-"+(i+1));
    }

  });
}

function loadState(){

  try{

    const x = JSON.parse(
      localStorage.getItem("ygo-state") || "null"
    );

    if(!x)return;

    if(
      Array.isArray(x.lp) &&
      x.lp.length === 2
    ){
      state.lp = x.lp.map(v =>
        Math.max(0,Number(v) || 0)
      );
    }

    if(
      Array.isArray(x.names) &&
      x.names.length === 2
    ){
      state.names = x.names.map(
        (v,i) => String(v || "PLAYER "+(i+1))
      );
    }

    if(Array.isArray(x.history)){
      state.history = x.history;
    }

    if(typeof x.notes === "string"){
      state.notes = x.notes;
    }

    if(Number.isFinite(Number(x.timerSeconds))){
      state.timerSeconds =
        Math.max(0,Number(x.timerSeconds));
    }

    if(Number.isFinite(Number(x.timerInitialSeconds))){
      state.timerInitialSeconds =
        Math.max(1,Number(x.timerInitialSeconds));
    }

  }catch(e){

    console.warn(
      "Stato locale non valido",
      e
    );
  }
}

function applyBackground(){

  if(state.bg){

    document.body.style.setProperty(
      "--user-bg",
      `url("${state.bg}")`
    );

  }else{

    document.body.style.removeProperty(
      "--user-bg"
    );
  }
}

/* =========================
   LIFE POINTS
========================= */

function lifeColor(v){

  v = Math.max(0,Number(v) || 0);

  const s = [
    [8000,92,235,138],
    [7000,105,228,126],
    [6000,151,225,91],
    [5000,196,222,70],
    [4000,232,218,58],
    [3000,245,181,50],
    [2000,245,133,48],
    [1000,239,91,67],
    [0,205,42,67]
  ];

  if(v >= 8000){
    return [
      "rgb(92,235,138)",
      "rgba(92,235,138,.38)"
    ];
  }

  for(
    let i=0;
    i<s.length-1;
    i++
  ){

    const h = s[i];
    const l = s[i+1];

    if(
      v <= h[0] &&
      v >= l[0]
    ){

      const p =
        (h[0]-v) /
        (h[0]-l[0]);

      const r = Math.round(
        h[1]+(l[1]-h[1])*p
      );

      const g = Math.round(
        h[2]+(l[2]-h[2])*p
      );

      const b = Math.round(
        h[3]+(l[3]-h[3])*p
      );

      return [
        `rgb(${r},${g},${b})`,
        `rgba(${r},${g},${b},.30)`
      ];
    }
  }

  return [
    "rgb(205,42,67)",
    "rgba(205,42,67,.35)"
  ];
}

function updateLifeBar(p){

  const v =
    Math.max(
      0,
      Number(state.lp[p-1]) || 0
    );

  const f = $("#lifeFill"+p);

  if(!f)return;

  f.style.width =
    Math.min(100,v/8000*100)+"%";

  const [c,g] = lifeColor(v);

  f.style.backgroundColor = c;

  f.style.boxShadow =
    `0 0 12px ${g}`;
}

/* =========================
   IMAGE
========================= */

function compressImage(
  file,
  maxSide=1200,
  quality=.86
){

  return new Promise(
    (resolve,reject)=>{

      const r = new FileReader();

      r.onerror = () =>
        reject(
          r.error ||
          new Error("Lettura fallita")
        );

      r.onload = () => {

        const img = new Image();

        img.onerror = () =>
          reject(
            new Error("Immagine non valida")
          );

        img.onload = () => {

          const scale =
            Math.min(
              1,
              maxSide /
              Math.max(
                img.naturalWidth || 1,
                img.naturalHeight || 1
              )
            );

          const c =
            document.createElement("canvas");

          c.width =
            Math.max(
              1,
              Math.round(
                (img.naturalWidth || 1) *
                scale
              )
            );

          c.height =
            Math.max(
              1,
              Math.round(
                (img.naturalHeight || 1) *
                scale
              )
            );

          const ctx =
            c.getContext("2d");

          if(!ctx){
            resolve(r.result);
            return;
          }

          ctx.fillStyle="#0b0d12";
          ctx.fillRect(
            0,
            0,
            c.width,
            c.height
          );

          ctx.drawImage(
            img,
            0,
            0,
            c.width,
            c.height
          );

          let out =
            c.toDataURL(
              "image/jpeg",
              quality
            );

          if(out.length > 3500000){

            out =
              c.toDataURL(
                "image/jpeg",
                .68
              );
          }

          resolve(out);
        };

        img.src = r.result;
      };

      r.readAsDataURL(file);
    }
  );
}

function renderImages(){

  for(let p=1;p<=2;p++){

    const slot =
      $("#imageSlot"+p);

    if(!slot)continue;

    const old =
      slot.querySelector("img");

    if(old)old.remove();

    if(!state.images[p-1]){

      slot.classList.add("empty");
      continue;
    }

    slot.classList.remove("empty");

    const img =
      document.createElement("img");

    img.src =
      state.images[p-1];

    img.alt =
      "Immagine Player "+p;

    img.draggable=false;

    slot.appendChild(img);
  }
}

function setupImageSlot(p){

  const slot =
    $("#imageSlot"+p);

  const input =
    $("#imageInput"+p);

  if(!slot || !input)return;

  slot.addEventListener(
    "click",
    e => {

      if(imageLongPressTriggered[p]){

        imageLongPressTriggered[p] = false;

        e.preventDefault();

        return;
      }

      input.click();
    }
  );

  input.addEventListener(
    "change",
    async e => {

      const f =
        e.target.files?.[0];

      if(!f)return;

      try{

        if(!f.type.startsWith("image/")){
          throw new Error("file");
        }

        state.images[p-1] =
          await compressImage(f);

        renderImages();
        save();

      }catch(err){

        console.error(err);

        alert(
          "Non è stato possibile caricare l'immagine."
        );

      }finally{

        input.value="";
      }
    }
  );

  slot.addEventListener(
    "pointerdown",
    e => {

      if(
        !state.images[p-1] ||
        e.target.tagName !== "IMG"
      ){
        return;
      }

      imageLongPressTriggered[p]=false;

      clearTimeout(
        imageLongPressTimers[p]
      );

      imageLongPressTimers[p] =
        setTimeout(
          () => {

            imageLongPressTriggered[p]=true;

            state.images[p-1]="";

            renderImages();
            save();

          },
          650
        );
    }
  );

  [
    "pointerup",
    "pointercancel",
    "pointerleave"
  ].forEach(
    t =>
      slot.addEventListener(
        t,
        () => {
          clearTimeout(
            imageLongPressTimers[p]
          );

          imageLongPressTimers[p]=null;
        }
      )
  );
}

   HISTORY
========================= */

function addHistory(
  player,
  n,
  before,
  after,
  action
){

  state.history.unshift({
    id:Date.now()+Math.random(),
    time:new Date().toLocaleTimeString(
      "it-IT",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    ),
    player,
    n,
    before,
    after,
    action:action || ""
  });
}

function change(
  player,
  amount,
  action=""
){

  const before =
    Math.max(
      0,
      Number(state.lp[player-1]) || 0
    );

  const after =
    Math.max(
      0,
      before+amount
    );

  state.lp[player-1]=after;

  addHistory(
    player,
    amount,
    before,
    after,
    action
  );

  render();
}

function halveLP(player){

  const before =
    Math.max(
      0,
      Number(state.lp[player-1]) || 0
    );

  const after =
    Math.floor(before/2);

  state.lp[player-1]=after;

  addHistory(
    player,
    after-before,
    before,
    after,
    "Dimezza LP"
  );

  render();
}

function undo(){

  if(!state.history.length)return;

  const last =
    state.history.shift();

  if(
    last &&
    last.player &&
    Number.isFinite(Number(last.before))
  ){

    state.lp[last.player-1] =
      Math.max(
        0,
        Number(last.before)
      );
  }

  render();
}

function updateKeypad(){

  const e =
    $("#keypadValue");

  if(e){
    e.textContent =
      keypadValue || "0";
  }
}

function handleKeypad(k){

  if(/^\d$/.test(k)){

    if(keypadValue.length>=7)return;

    keypadValue =
      keypadValue==="0"
        ? k
        : keypadValue+k;

    updateKeypad();

    return;
  }

  if(k==="clear"){

    keypadValue="";

    updateKeypad();

    return;
  }

  if(k==="back"){

    keypadValue =
      keypadValue.slice(0,-1);

    updateKeypad();

    return;
  }

  if(k==="confirm"){

    const v =
      Number(keypadValue);

    if(
      !Number.isInteger(v) ||
      v<=0
    ){
      return;
    }

    change(
      currentAmountPlayer,
      currentAmountSign*v
    );

    closeModal();
  }
}

========================= */

const TEXT_ROWS=[
  ["Q","W","E","R","T","Y","U","I","O","P"],
  ["A","S","D","F","G","H","J","K","L"],
  ["Z","X","C","V","B","N","M"]
];

const TEXT_SYMBOLS=[
  ".",
  "-",
  "'"
];

let textBuffer="";
let textMaxLength=18;
let textShift=true;
let textCursor=0;
let textSaveCallback=null;

function renderTextKeyboard(){

  const preview =
    $("#textPreview");

  if(preview){

    preview.textContent =
      textBuffer || "Nome giocatore";

    preview.classList.toggle(
      "empty",
      !textBuffer
    );
  }

  const count =
    $("#textCount");

  if(count){

    count.textContent =
      `${textBuffer.length}/${textMaxLength}`;
  }

  $$(".text-key[data-letter]",modalBody)
    .forEach(
      key => {

        const letter =
          key.dataset.letter;

        key.textContent =
          textShift
            ? letter
            : letter.toLowerCase();
      }
    );

  const shiftButton =
    $(".text-key.shift",modalBody);

  if(shiftButton){

    shiftButton.classList.toggle(
      "active",
      textShift
    );
  }

  const p =
    $("#textPreview");

  if(p){
    p.scrollTop=p.scrollHeight;
  }
}

function insertText(value){

  if(textBuffer.length>=textMaxLength){
    return;
  }

  const maxAdd =
    textMaxLength-textBuffer.length;

  value =
    value.slice(0,maxAdd);

  textBuffer =
    textBuffer.slice(0,textCursor) +
    value +
    textBuffer.slice(textCursor);

  textCursor += value.length;

  renderTextKeyboard();
}

function backspaceText(){

  if(textCursor<=0)return;

  textBuffer =
    textBuffer.slice(0,textCursor-1) +
    textBuffer.slice(textCursor);

  textCursor--;

  renderTextKeyboard();
}

function clearText(){

  textBuffer="";
  textCursor=0;

  renderTextKeyboard();
}

function openNameKeyboard(
  player,
  value
){

  textBuffer =
    String(value || "");

  textMaxLength=18;
  textShift=true;
  textCursor=textBuffer.length;

  textSaveCallback =
    newValue => {

      state.names[player-1] =
        newValue.trim() ||
        "PLAYER "+player;

      render();
      closeModal();
    };

  const numberRow =
    `
    <div class="text-row row10">
      ${
        "1234567890"
          .split("")
          .map(
            n =>
              `<button
                class="text-key"
                data-text="${n}"
                type="button">
                ${n}
              </button>`
          )
          .join("")
      }
    </div>
    `;

  const keyboardRows =
    numberRow +
    TEXT_ROWS.map(
      row => {

        const cls =
          row.length===10
            ? "row10"
            : row.length===9
              ? "row9"
              : "row7";

        return `
        <div class="text-row ${cls}">
          ${
            row.map(
              letter =>
                `<button
                  class="text-key"
                  data-letter="${letter}"
                  type="button">
                  ${letter}
                </button>`
            ).join("")
          }
        </div>
        `;
      }
    ).join("");

  const symbolButtons =
    TEXT_SYMBOLS
      .map(
        symbol =>
          `<button
            class="text-key"
            data-text="${escapeHtml(symbol)}"
            type="button">
            ${escapeHtml(symbol)}
          </button>`
      )
      .join("");

  /*
    Le funzioni secondarie vengono tutte messe
    nella stessa riga: nessun blocco "spezzato".
  */

  openModal(
    "Nome giocatore",
    `
    <div class="text-editor">

      <div
        class="text-preview"
        id="textPreview">
      </div>

      <div
        class="text-editor-info"
        id="textCount">
        0/18
      </div>

      <div class="text-keypad">

        ${keyboardRows}

        <div class="text-row bottom-key-row">

          <button
            class="text-key shift"
            type="button"
            data-text-action="shift">
            ⇧
          </button>

          ${symbolButtons}

          <button
            class="text-key clear"
            type="button"
            data-text-action="clear">
            C
          </button>

          <button
            class="text-key space"
            type="button"
            data-text-action="space">
            SPAZIO
          </button>

          <button
            class="text-key special"
            type="button"
            data-text-action="undo">
            ↶
          </button>

          <button
            class="text-key confirm"
            type="button"
            data-text-action="confirm">
            ✓
          </button>

        </div>

      </div>

    </div>
    `
  );

  $$(".text-key",modalBody)
    .forEach(
      button =>
        button.addEventListener(
          "pointerdown",
          e => {

            e.preventDefault();
            e.stopPropagation();

            const letter =
              button.dataset.letter;

            if(letter){

              insertText(
                textShift
                  ? letter
                  : letter.toLowerCase()
              );

              if(textShift){

                textShift=false;

                renderTextKeyboard();
              }

              return;
            }

            const text =
              button.dataset.text;

            if(text){

              insertText(text);

              return;
            }

            const action =
              button.dataset.textAction;

            if(action==="shift"){

              textShift=!textShift;

              renderTextKeyboard();

            }else if(action==="back"){

              backspaceText();

            }else if(action==="clear"){

              clearText();

            }else if(action==="space"){

              insertText(" ");

            }else if(action==="undo"){

              const original =
                "PLAYER "+player;

              textBuffer=original;
              textCursor=original.length;

              renderTextKeyboard();

            }else if(
              action==="confirm" &&
              typeof textSaveCallback==="function"
            ){

              textSaveCallback(
                textBuffer
              );
            }
          }
        )
    );

  renderTextKeyboard();
}

function escapeHtml(v){

  return String(v)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function temporaryDie(final){

  let v;

  do{
    v=secureDie();
  }while(v===final);

  return v;
}

function rollDie(){

  const die =
    $("#die");

  if(
    !die ||
    diceRolling
  ){
    return;
  }

  diceRolling=true;

  const final =
    nextDieResult();

  die.textContent =
    temporaryDie(final);

  die.classList.remove(
    "rolling"
  );

  void die.offsetWidth;

  die.classList.add(
    "rolling"
  );

  const start =
    performance.now();

  function anim(now){

    if(!die.isConnected){

      diceRolling=false;

      return;
    }

    if(now-start<760){

      die.textContent =
        temporaryDie(final);

      requestAnimationFrame(anim);
    }
  }

  requestAnimationFrame(anim);

  setTimeout(
    () => {

      if(!die.isConnected){

        diceRolling=false;

        return;
      }

      die.textContent=final;

      die.classList.remove(
        "rolling"
      );

      diceRolling=false;

    },
    870
  );
}

function flipCoin(){

  const coin =
    $("#coin");

  const stage =
    $("#coinStage");

  if(
    !coin ||
    coinBusy
  ){
    return;
  }

  coinBusy=true;

  const final =
    nextCoinResult();

  /*
    Ogni lancio viene completamente riavviato.
    Questo evita che il secondo tap sulla moneta
    erediti lo stato dell'animazione precedente.
  */

  coin.classList.remove(
    "flip",
    "heads",
    "tails"
  );

  void coin.offsetWidth;

  coin.classList.add(
    "flip",
    final==="TESTA"
      ? "heads"
      : "tails"
  );

  if(stage){
    stage.classList.add(
      "tossing"
    );
  }

  setTimeout(
    () => {

      if(!coin.isConnected){

        coinBusy=false;

        return;
      }

      coin.classList.remove(
        "flip",
        "heads",
        "tails"
      );

      if(stage){

        stage.classList.remove(
          "tossing"
        );
      }

      /*
        La faccia risultante resta visibile.
        Il prossimo tap può quindi rilanciare
        immediatamente la moneta.
      */

      coinBusy=false;

    },
    1090
  );
}

/* =========================
   TIMER
========================= */

function formatTime(s){

  s=Math.max(
    0,
    Math.floor(s)
  );

  const h =
    Math.floor(s/3600);

  const m =
    Math.floor(
      (s%3600)/60
    );

  const sec =
    s%60;

  if(h){

    return [
      String(h).padStart(2,"0"),
      String(m).padStart(2,"0"),
      String(sec).padStart(2,"0")
    ].join(":");
  }

  return [
    String(m).padStart(2,"0"),
    String(sec).padStart(2,"0")
  ].join(":");
}

function updateTimerButtonIcon(){

  const button =
    $("#timerBtn");

  if(!button)return;

  if(timerRunning){

    button.textContent =
      formatTime(
        state.timerSeconds
      );

    button.setAttribute(
      "aria-label",
      "Timer in corso"
    );

  }else{

    button.textContent="◷";

    button.setAttribute(
      "aria-label",
      "Timer"
    );
  }
}

function updateTimerDisplay(){

  const d =
    $("#timerDisplay");

  if(!d)return;

  d.textContent =
    formatTime(
      state.timerSeconds
    );

  d.classList.remove(
    "warning",
    "danger"
  );

  if(state.timerSeconds<=60){

    d.classList.add(
      "danger"
    );

  }else if(
    state.timerSeconds<=300
  ){

    d.classList.add(
      "warning"
    );
  }
}

function updateTimerButtons(){

  const a =
    $("#timerStart");

  if(!a)return;

  a.disabled =
    timerRunning ||
    state.timerSeconds<=0;

  a.style.opacity =
    timerRunning ||
    state.timerSeconds<=0
      ? ".45"
      : "1";
}

function updateTimerFromClock(){

  if(!timerRunning)return;

  const now =
    Date.now();

  const elapsed =
    Math.floor(
      (now-timerLastTick)/1000
    );

  if(elapsed<=0)return;

  timerLastTick +=
    elapsed*1000;

  state.timerSeconds =
    Math.max(
      0,
      state.timerSeconds-elapsed
    );

  updateTimerDisplay();
  updateTimerButtonIcon();
  save();

  if(
    state.timerSeconds<=0
  ){

    stopTimer();

    updateTimerDisplay();
    updateTimerButtons();
    updateTimerButtonIcon();
  }
}

function startTimer(){

  if(
    timerRunning ||
    state.timerSeconds<=0
  ){
    return;
  }

  timerRunning=true;

  timerLastTick =
    Date.now();

  timerInterval =
    setInterval(
      updateTimerFromClock,
      250
    );

  updateTimerDisplay();
  updateTimerButtons();
  updateTimerButtonIcon();

  save();
}

function stopTimer(){

  if(timerInterval!==null){

    clearInterval(
      timerInterval
    );

    timerInterval=null;
  }

  timerRunning=false;
  timerLastTick=0;

  updateTimerButtonIcon();
}

function resetTimer(){

  stopTimer();

  state.timerSeconds =
    state.timerInitialSeconds;

  updateTimerDisplay();
  updateTimerButtons();
  updateTimerButtonIcon();

  save();
}

function openTimer(){

  openModal(
    "Timer duello",
    `
    <div
      class="timer-display"
      id="timerDisplay">
      ${formatTime(
        state.timerSeconds
      )}
    </div>

    <button
      class="timer-edit"
      id="timerEdit"
      type="button">
      CAMBIA DURATA
    </button>

    <div class="timer-controls">

      <button
        class="timer-btn"
        id="timerStart"
        type="button">
        ▶ AVVIA
      </button>

      <button
        class="timer-btn"
        id="timerReset"
        type="button">
        ↻ RESET
      </button>

    </div>
    `
  );

  updateTimerDisplay();
  updateTimerButtons();
  updateTimerButtonIcon();

  $("#timerStart").addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();

      startTimer();

      /*
        NUOVO COMPORTAMENTO:
        appena si preme AVVIA, la schermata
        del timer viene chiusa automaticamente.
      */

      closeModal();
    }
  );

  $("#timerReset").addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();

      resetTimer();
    }
  );

  $("#timerEdit").addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();

      openTimerKeypad();
    }
  );
}

function openTimerKeypad(){

  let v="";

  openModal(
    "Durata timer",
    `
    <div class="keypad-wrap">

      <div class="keypad-operation">
        INSERISCI I MINUTI · DEFAULT 45
      </div>

      <div
        class="keypad-value"
        id="timerKeyValue">
        0
      </div>

      <div class="keypad">

        <button class="key" data-k="1" type="button">1</button>
        <button class="key" data-k="2" type="button">2</button>
        <button class="key" data-k="3" type="button">3</button>

        <button class="key" data-k="4" type="button">4</button>
        <button class="key" data-k="5" type="button">5</button>
        <button class="key" data-k="6" type="button">6</button>

        <button class="key" data-k="7" type="button">7</button>
        <button class="key" data-k="8" type="button">8</button>
        <button class="key" data-k="9" type="button">9</button>

        <button class="key clear" data-k="c" type="button">C</button>
        <button class="key" data-k="0" type="button">0</button>
        <button class="key action" data-k="b" type="button">⌫</button>

        <button
          class="key confirm"
          data-k="ok"
          type="button"
          style="grid-column:1/-1">
          ✓ CONFERMA
        </button>

      </div>

    </div>
    `
  );

  const display =
    $("#timerKeyValue");

  const update =
    () =>
      display.textContent =
        v || "0";

  $$(".key",modalBody)
    .forEach(
      b =>
        b.addEventListener(
          "pointerdown",
          e => {

            e.preventDefault();
            e.stopPropagation();

            const k =
              b.dataset.k;

            if(/^\d$/.test(k)){

              if(v.length>=3)return;

              v =
                v==="0"
                  ? k
                  : v+k;

              update();

            }else if(k==="c"){

              v="";

              update();

            }else if(k==="b"){

              v=v.slice(0,-1);

              update();

            }else if(k==="ok"){

              applyTimerMinutes(v);
            }
          }
        )
    );
}

function applyTimerMinutes(value){

  const min =
    Math.max(
      1,
      parseInt(value,10) || 0
    );

  state.timerInitialSeconds =
    min*60;

  state.timerSeconds =
    min*60;

  stopTimer();

  save();

  closeModal();

  openTimer();
}

$("#timerBtn").addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    openTimer();
  }
);

/* =========================
   BACKGROUND
========================= */

let bgLongPress=null;
let bgLongPressed=false;

$("#bgBtn").addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    bgLongPressed=false;

    clearTimeout(
      bgLongPress
    );

    bgLongPress =
      setTimeout(
        () => {

          bgLongPressed=true;

          state.bg="";

          applyBackground();

          save();

        },
        650
      );
  }
);

[
  "pointerup",
  "pointercancel",
  "pointerleave"
].forEach(
  t =>
    $("#bgBtn").addEventListener(
      t,
      e => {

        clearTimeout(
          bgLongPress
        );

        if(
          t==="pointerup" &&
          !bgLongPressed
        ){

          const input =
            $("#bgInput");

          if(input){

            input.value="";

            input.click();
          }
        }
      }
    )
);

$("#bgInput").addEventListener(
  "change",
  async e => {

    const f =
      e.target.files?.[0];

    if(!f)return;

    try{

      if(!f.type.startsWith("image/")){
        throw new Error("file");
      }

      state.bg =
        await compressImage(
          f,
          1600,
          .78
        );

      applyBackground();

      save();

    }catch(err){

      console.error(err);

      alert(
        "Non è stato possibile caricare lo sfondo."
      );

    }finally{

      e.target.value="";
    }
  }
);

/* =========================
   RESET
========================= */

$("#resetBtn").addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    stopTimer();

    state.lp=[
      8000,
      8000
    ];

    state.history=[];

    state.notes="";

    state.timerInitialSeconds=
      2700;

    state.timerSeconds=
      2700;

    diceRolling=false;
    coinBusy=false;

    resetRandomSequences();

    render();

    closeModal();
  }
);

/* =========================
   INIT
========================= */

loadState();

if(
  !state.timerInitialSeconds ||
  state.timerInitialSeconds<1
){

  state.timerInitialSeconds=
    2700;

  state.timerSeconds=
    2700;
}

resetRandomSequences();

applyBackground();

setupImageSlot(1);
setupImageSlot(2);

render();
</script>
